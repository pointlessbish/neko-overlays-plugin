# Location: neko-overlays-plugin/Cargo.toml
# File: Cargo.toml

[package]
name = "neko-overlays-plugin"
version = "26.1.1"
edition = "2021"
license = "GPL-2.0-or-later"

[lib] 
# OBS loads plugins as shared libraries (.so / .dll / .dylib)
crate-type = ["cdylib"]
 
[dependencies]
serde_json = "1"
ureq = { version = "2.12", features = ["json"] }
# The local web server that serves the info bar page to OBS's browser source (127.0.0.1 only)
tiny_http = "0.12"
# Twitch chat (IRC over TLS) for subscribers, cheers and watch streaks
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "0.26"

[build-dependencies]
bindgen = "0.71"
pkg-config = "0.3"
# Compiles the info bar styles (assets/styles/*.scss) while building, so no Node or Sass install is needed
grass = { version = "0.13", default-features = false }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true

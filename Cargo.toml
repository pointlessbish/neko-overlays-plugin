[package]
name = "neko-overlays-plugin"
version = "26.2.0"
edition = "2021"
license = "GPL-2.0-or-later"

[lib]
crate-type = ["cdylib"]

[dependencies]
serde_json = "1"
ureq = { version = "2.12", features = ["json"] }
tiny_http = "0.12"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "0.26"

[build-dependencies]
bindgen = "0.71"
pkg-config = "0.3"
grass = { version = "0.13", default-features = false }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
